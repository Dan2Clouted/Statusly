services:
  db:
    image: postgres:17
    container_name: statusly-db
    environment:
      POSTGRES_USER: statusly
      POSTGRES_PASSWORD: statusly_dev_password
      POSTGRES_DB: statusly
    ports:
      - "5432:5432"
    volumes:
      - statusly-data:/var/lib/postgresql/data

volumes:
  statusly-data:
